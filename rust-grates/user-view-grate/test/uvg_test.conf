# Policy for the user-view-grate tests. The fixtures it names are copied to the lindfs root.

[users]
4000001 = dana

# A password database: everyone sees, and may rewrite, only their own line.
[file /uvg_shadow]
user root
  raw
user mallory
  deny
user *
  keep ^{user}:
  write

# A payment log: support reads it with card numbers and tokens masked and without debug lines.
[file /uvg_payments.log]
user auditor
  raw
user support
  drop \bDEBUG\b
  replace \b(\d{4})-\d{4}-\d{4}-(\d{4})\b => $1-****-****-$2
  replace token=\S+ => token=[redacted]

# Invoices: support sees ids and amounts, not customers or bank details.
[file /uvg_invoices.csv]
user support
  replace ^([^,]*),[^,]*,([^,]*),[^,]*$ => $1,-,$2,-

[file /uvg_secret]
user root
  raw
user support
  deny

# No block names support, so support is denied.
[file /uvg_audit.log]
user auditor
  raw

[file /uvg_notes]
user *
  readonly

# With no --user, a cage is identified by its effective uid.
[file /uvg_uid]
user *
  keep ^{uid}:
  write
