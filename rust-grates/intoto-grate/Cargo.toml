[package]
name = "intoto-grate"
version = "0.1.0"
edition = "2024"
description = "Signs in-toto statements over the preload archives the IMFS grate stages"

[dependencies]
grate-rs = { git = "https://github.com/Lind-Project/lind-wasm-example-grates", branch = "main", subdir = "lib/grate-rs" }
preload-archive = { path = "../../lib/preload-archive" }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
ecdsa = { version = "0.16", default-features = false, features = ["der"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
