# Weekly full-suite CI for lind-wasm-example-grates
#
# Invoked by a trigger that Cloud Scheduler fires every Friday at 07:00 America/New_York. 
# Runs the complete test suite, publishes the result as a GitHub pre-release, and reports pass/fail.
#
# Step layout:
#   1. Build And Test   - runs the Dockerfile's test stage, writes to /workspace(This workspace directory is a volume created when Cloud Build runs.)
#   2. Publish Release  - creates or updates a date-tagged GitHub pre-release, uploads the logs as release assets, and notifies Slack.
#   3. Evaluate         - reads e2e_status and decides the build's pass/fail
#

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE

substitutions:
  _GITHUB_REPO: "Lind-Project/lind-wasm-example-grates"

availableSecrets:
  secretManager:
    - versionName: projects/x-micron-451502-m7/secrets/github-token-grates-ci/versions/latest
      env: GITHUB_TOKEN
    # versions/latest, not a pinned version: moving the notification to a
    # different Slack channel means adding a new secret version, and the next
    # build should pick it up without a change to this file.
    - versionName: projects/x-micron-451502-m7/secrets/slack-webhook-grates-ci/versions/latest
      env: SLACK_WEBHOOK

# The full suite is slower than a per-directory PR run, and ipc-grate is a
# known timeout offender. 60 minutes leaves room without hanging all morning.
timeout: 3600s

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: Build And Test
    entrypoint: bash
    env:
      # Triggers populate BRANCH_NAME from the branch the trigger runs
      # against. COMMIT_SHA is empty on triggers; the release step
      # resolves it from the GitHub API instead.
      - "BRANCH_NAME=$BRANCH_NAME"
      - "COMMIT_SHA=$COMMIT_SHA"
    args:
      - -c
      - |
        set -euo pipefail

        branch="$${BRANCH_NAME:-main}"
        commit="$${COMMIT_SHA:-}"

        # Output goes under /workspace because that volume is shared across
        # steps. Publish Release and Evaluate both read from it.
        out=/workspace/out
        rm -rf "$${out}"

        # --output type=local needs the docker-container driver; the default
        # docker driver cannot export a filesystem.
        docker buildx create --use --name cbuilder --driver docker-container \
          || docker buildx use cbuilder
        docker buildx inspect --bootstrap

        echo "Weekly run: branch=$${branch} commit=$${commit:-<none>}"

        # No TEST_DIRS build-arg, so the Dockerfile runs the full suite.
        # This command fails only if the image build itself fails. A test
        # failure is captured in e2e_status and evaluated in the last step.
        docker buildx build \
          --platform=linux/amd64 \
          --progress=plain \
          --pull \
          --target artifacts \
          --build-arg BRANCH_NAME="$${branch}" \
          --build-arg COMMIT_SHA="$${commit}" \
          --output type=local,dest="$${out}" \
          .

  - name: "gcr.io/cloud-builders/gcloud"
    id: Publish Release
    entrypoint: bash
    secretEnv: ["GITHUB_TOKEN", "SLACK_WEBHOOK"]
    env:
      - "BRANCH_NAME=$BRANCH_NAME"
      - "COMMIT_SHA=$COMMIT_SHA"
      - "BUILD_ID=$BUILD_ID"
      - "PROJECT_ID=$PROJECT_ID"
      - "GITHUB_REPO=${_GITHUB_REPO}"
    args:
      - -c
      - |
        # No -e: this step reports problems and exits 0. Publishing is a
        # recording concern, not a test result.
        set -uo pipefail

        out=/workspace/out
        api=https://api.github.com
        # Asset uploads use a different host than the rest of the REST API.
        uploads=https://uploads.github.com

        # Files attached to the release so the full log is readable without a
        # GCP account. Parallel arrays: source path on the left, the name the
        # asset gets on the release page on the right.
        asset_srcs=(
          "$${out}/test-artifacts/make-test.plain.log"
          "$${out}/test-artifacts/test-summary.txt"
          "$${out}/test-artifacts/revision.txt"
        )
        asset_names=(
          "make-test.log"
          "test-summary.txt"
          "revision.txt"
        )

        # Both are needed before the first early exit, because a skipped run
        # still sends a Slack message that names the week and the repo.
        tag="$(date -u +%Y-%m-%d)"
        release_url="https://github.com/$${GITHUB_REPO}/releases/tag/$${tag}"

        # Post one message to Slack. Never fails the step and never prints the
        # webhook URL: anyone holding that URL can post to the channel, and
        # this log is readable by everyone with access to the build.
        notify_slack() {
          if [[ -z "$${SLACK_WEBHOOK:-}" ]]; then
            echo "Slack notification skipped: SLACK_WEBHOOK is empty."
            return 0
          fi

          # python builds the payload so newlines and quotes in the text are
          # escaped correctly.
          local payload
          payload="$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$$1")"

          curl -sS -o /dev/null -w 'slack: HTTP %{http_code}\n' \
            -X POST -H 'Content-Type: application/json' \
            -d "$${payload}" "$${SLACK_WEBHOOK}" \
            || echo "slack: request failed."
        }

        # Every early exit goes through here so the reason lands in the log and
        # in Slack. A week that produced no release is still a week worth
        # hearing about - silence would look identical to a healthy run.
        skip() {
          echo "Publish skipped: $$1"
          notify_slack "$$(printf '%s\n%s\n%s' \
            "Weekly grate test completed - $${tag}" \
            "$${GITHUB_REPO}" \
            "Release was not published: $$1")"
          exit 0
        }

        [[ -n "$${GITHUB_TOKEN:-}" ]] || skip "GITHUB_TOKEN is empty."
        [[ -f "$${out}/test-artifacts/test-summary.txt" ]] \
          || skip "no test summary was produced."

        # Refuse to guess. Tagging the wrong branch is worse than not tagging.
        branch="$${BRANCH_NAME:-}"
        [[ -n "$${branch}" ]] \
          || skip "BRANCH_NAME is empty, so the branch to tag is unknown."

        auth=(-H "Authorization: Bearer $${GITHUB_TOKEN}"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28")

        # Triggers leave COMMIT_SHA empty, so resolve the branch head.
        commit="$${COMMIT_SHA:-}"
        if [[ -z "$${commit}" ]]; then
          commit="$(curl -sS "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/commits/$${branch}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("sha",""))' \
            2>/dev/null)"
        fi
        [[ -n "$${commit}" ]] \
          || skip "could not resolve the head commit of $${branch}."

        # Asset download URLs follow a fixed pattern that depends only on the
        # tag and the file name, so the body can link them before the upload
        # happens. On a public repo these links need no login at all.
        asset_base="https://github.com/$${GITHUB_REPO}/releases/download/$${tag}"

        # Body: the summary verbatim, then the commit and the logs needed to
        # trace this result back. The base image is always lind-wasm-dev:latest;
        # see the pipeline docs.
        {
          echo '```'
          cat "$${out}/test-artifacts/test-summary.txt"
          echo '```'
          echo
          echo "branch: \`$${branch}\`"
          echo "commit: \`$${commit}\`"
          echo
          echo "Logs files:"
          echo
          echo "- [make-test.log]($${asset_base}/make-test.log) - full test output"
          echo "- [test-summary.txt]($${asset_base}/test-summary.txt) - pass/fail breakdown"
          echo "- [revision.txt]($${asset_base}/revision.txt) - what was built"
        } > /workspace/release-body.md

        # Build the JSON payload in python so the summary text is escaped
        # correctly regardless of what the test output contained.
        python3 - "$${tag}" "$${commit}" /workspace/release-body.md \
          > /workspace/release-payload.json <<'PY'
        import json, sys
        tag, commit, body_path = sys.argv[1], sys.argv[2], sys.argv[3]
        with open(body_path) as f:
            body = f.read()
        print(json.dumps({
            "tag_name": tag,
            "target_commitish": commit,
            "name": "Weekly grate test " + tag,
            "body": body,
            "prerelease": True,
            "make_latest": "false",
        }))
        PY

        # A same-day rerun updates the existing release rather than failing on
        # a duplicate tag. Numbered suffixes can come later if a week ever
        # needs more than one recorded run.
        release_id="$(curl -sS "$${auth[@]}" \
          "$${api}/repos/$${GITHUB_REPO}/releases/tags/$${tag}" \
          | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' \
          2>/dev/null)"

        if [[ -n "$${release_id}" ]]; then
          echo "Release for $${tag} exists (id=$${release_id}). Updating it."

          # The tag itself still points at the earlier commit, so move it.
          curl -sS -o /dev/null -w 'move tag: HTTP %{http_code}\n' \
            -X PATCH "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/git/refs/tags/$${tag}" \
            -d "{\"sha\":\"$${commit}\",\"force\":true}"

          code="$(curl -sS -o /workspace/release-response.json -w '%{http_code}' \
            -X PATCH "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/releases/$${release_id}" \
            -d @/workspace/release-payload.json)"
        else
          echo "Creating release $${tag}."
          code="$(curl -sS -o /workspace/release-response.json -w '%{http_code}' \
            -X POST "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/releases" \
            -d @/workspace/release-payload.json)"
        fi

        if [[ "$${code}" != 2* ]]; then
          echo "The test result below still stands."
          head -c 2000 /workspace/release-response.json || true
          echo
          skip "GitHub returned HTTP $${code}."
        fi

        url="$(python3 -c 'import sys,json; print(json.load(sys.stdin).get("html_url",""))' \
          < /workspace/release-response.json 2>/dev/null)"
        echo "Published: $${url}"

        # The create path has no release id yet; read it back from the response.
        if [[ -z "$${release_id}" ]]; then
          release_id="$(python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' \
            < /workspace/release-response.json 2>/dev/null)"
        fi
        # Past this point the release exists, so a problem here is no longer a
        # publishing failure - it only costs the attachments. skip() would send
        # the wrong Slack message, so this path just warns.
        if [[ -z "$${release_id}" ]]; then
          echo "release id could not be resolved, so no assets were attached."
        fi

        # Attach one file. A same-day rerun would collide on the asset name,
        # so any existing asset with that name is removed first. Failures here
        # are logged and ignored - a missing attachment must not read as a
        # failed test.
        upload_asset() {
          local src="$$1"
          local name="$$2"

          if [[ ! -f "$${src}" ]]; then
            echo "asset $${name}: source $${src} not found, skipping."
            return 0
          fi

          local old_id
          old_id="$(curl -sS "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/releases/$${release_id}/assets?per_page=100" \
            | python3 -c 'import sys,json; n=sys.argv[1]; print(next((str(a["id"]) for a in json.load(sys.stdin) if a.get("name")==n),""))' \
              "$${name}" 2>/dev/null)"

          if [[ -n "$${old_id}" ]]; then
            curl -sS -o /dev/null -w "asset $${name}: delete old HTTP %{http_code}\n" \
              -X DELETE "$${auth[@]}" \
              "$${api}/repos/$${GITHUB_REPO}/releases/assets/$${old_id}"
          fi

          # text/plain so browsers have a chance of showing it inline instead
          # of forcing a download. Either way the file is publicly readable.
          local up_code
          up_code="$(curl -sS -o /workspace/asset-response.json -w '%{http_code}' \
            -X POST "$${auth[@]}" \
            -H "Content-Type: text/plain" \
            --data-binary @"$${src}" \
            "$${uploads}/repos/$${GITHUB_REPO}/releases/$${release_id}/assets?name=$${name}")"

          if [[ "$${up_code}" == 2* ]]; then
            echo "asset $${name}: uploaded ($$(wc -c < "$${src}") bytes)."
          else
            echo "asset $${name}: upload failed with HTTP $${up_code}."
            head -c 500 /workspace/asset-response.json || true
            echo
          fi
        }

        if [[ -n "$${release_id}" ]]; then
          for i in "$${!asset_srcs[@]}"; do
            upload_asset "$${asset_srcs[$$i]}" "$${asset_names[$$i]}"
          done
        fi

        # Result-neutral by design. Whether the suite passed is not the weekly
        # signal - that the run happened, and what changed, is. The release
        # page carries the detail, and its assets are readable without a login.
        notify_slack "$$(printf '%s\n%s\n%s' \
          "Weekly grate test completed - $${tag}" \
          "$${GITHUB_REPO}" \
          "Results: $${release_url}")"

  - name: "gcr.io/cloud-builders/gcloud"
    id: Evaluate
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail

        out=/workspace/out

        # Reaching here without e2e_status means the image built but the test
        # stage did not produce its marker - a Dockerfile problem, not a test
        # failure. Worth distinguishing in the logs.
        if [[ ! -f "$${out}/e2e_status" ]]; then
          echo "e2e_status was not produced. Check the test and artifacts stages."
          exit 1
        fi

        echo "===== revision ====="
        cat "$${out}/test-artifacts/revision.txt" || true

        echo "===== test summary ====="
        cat "$${out}/test-artifacts/test-summary.txt" || true
        echo "========================"

        status="$(tr -d '\r\n' < "$${out}/e2e_status")"
        echo "e2e_status: $${status}"

        if [[ "$${status}" != "E2E_STATUS=pass" ]]; then
          echo "===== make-test.log (last 200 lines) ====="
          tail -n 200 "$${out}/test-artifacts/make-test.plain.log" || true
          echo "=========================================="
          echo "One or more grate tests failed. See the summary above for the"
          echo "full pass/fail breakdown, and the log tail for details."
          exit 1
        fi

        echo "All tests passed."
        