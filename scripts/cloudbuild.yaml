# CI for lind-wasm-example-grates
#
# Runs identically for pull requests targeting main and for pushes to main.
# The goal of this stage is a single thing: surface a pass/fail test signal
# on the PR. Image publishing is deliberately out of scope.
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: Build And Test
    entrypoint: bash
    env:
      # PR triggers set _HEAD_BRANCH; push triggers set BRANCH_NAME.
      - "HEAD_BRANCH=${_HEAD_BRANCH}"
      - "BRANCH_NAME=${BRANCH_NAME}"
      - "COMMIT_SHA=${COMMIT_SHA}"
    args:
      - -c
      - |
        set -euo pipefail

        branch="${HEAD_BRANCH:-${BRANCH_NAME:-unknown}}"
        commit="${COMMIT_SHA:-}"

        # Write outputs outside /workspace.
        out=/tmp/grates-out
        rm -rf "${out}"

        # --output type=local requires the docker-container driver.
        docker buildx create --use --name cbuilder --driver docker-container \
          || docker buildx use cbuilder
        docker buildx inspect --bootstrap

        echo "Testing branch=${branch} commit=${commit:-<none>}"

        # The Dockerfile's test stage catches make failures and records the outcome in e2e_status.
        if ! docker buildx build \
          --platform=linux/amd64 \
          --progress=plain \
          --pull \
          --target artifacts \
          --build-arg BRANCH_NAME="${branch}" \
          --build-arg COMMIT_SHA="${commit}" \
          --output type=local,dest="${out}" \
          .; then
          echo "Build failed before the test stage could run."
          exit 1
        fi

        if [[ ! -f "${out}/e2e_status" ]]; then
          echo "e2e_status was not produced. Check the artifacts stage."
          exit 1
        fi

        echo "===== test summary ====="
        cat "${out}/test-artifacts/test-summary.txt" || true
        echo "========================"
        
        status="$(tr -d '\r\n' < "${out}/e2e_status")"
        echo "e2e_status: ${status}"

        if [[ "${status}" != "E2E_STATUS=pass" ]]; then
          echo "===== make-test.log (last 200 lines) ====="
          tail -n 200 "${out}/test-artifacts/make-test.plain.log" || true
          echo "=========================================="
          echo "One or more grate tests failed. See the summary above for the"
          echo "full pass/fail breakdown, and the log tail for details."
          exit 1
        fi

        echo "All tests passed."
        