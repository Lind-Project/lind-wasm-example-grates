[package]
name = "preload-archive"
version = "0.1.0"
edition = "2024"
description = "Preload archive format shared by the IMFS grate and the native mkpreload tool"

[features]
default = ["lind"]
# Host-side helpers that run inside a Lind cage (reading files through 3i).
# Native tools build with `default-features = false` and only get the format.
lind = ["dep:grate-rs"]

[dependencies]
grate-rs = { git = "https://github.com/Lind-Project/lind-wasm-example-grates", branch = "main", subdir = "lib/grate-rs", optional = true }
